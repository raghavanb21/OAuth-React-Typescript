<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credly — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/auth/index.js"></script>
</head>
<body>

<aside class="panel-left">
  <div class="brand">Credly<span>.</span></div>
  <div class="panel-tagline">
    <h2>Welcome<br><em>back</em> to<br>your space.</h2>
    <p>A calm, focused place to do your best thinking. Sign in to continue where you left off.</p>
  </div>
  <div class="panel-footer">© 2026 Credly</div>
</aside>

<main class="panel-right">
  <div class="form-shell">

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" role="tab" aria-selected="true"  data-tab="login">Sign in</button>
      <button class="tab-btn"        role="tab" aria-selected="false" data-tab="signup">Create account</button>
    </nav>

    <!-- LOGIN -->
    <div id="panel-login" class="form-panel active" role="tabpanel">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
        <p class="field-error" id="login-email-err"></p>
      </div>
      <div class="form-group">
        <label for="login-pw">Password</label>
        <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password">
        <p class="field-error" id="login-pw-err"></p>
      </div>
      <label class="check-row">
        <input type="checkbox" id="remember-me">
        <span>Remember me</span>
      </label>
      <button class="btn-primary" id="btn-login">
        <span class="btn-text">Sign in</span>
        <span class="spinner"></span>
      </button>
      <div class="or-divider">or</div>
      <button class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- SIGNUP -->
    <div id="panel-signup" class="form-panel" role="tabpanel">
      <div class="form-group">
        <label for="su-name">Full name</label>
        <input type="text" id="su-name" placeholder="Ada Lovelace" autocomplete="name">
        <p class="field-error" id="su-name-err"></p>
      </div>
      <div class="form-group">
        <label for="su-email">Email</label>
        <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email">
        <p class="field-error" id="su-email-err"></p>
      </div>
      <div class="form-group">
        <label for="su-pw">Password</label>
        <input type="password" id="su-pw" placeholder="••••••••" autocomplete="new-password">
        <div class="pw-strength" id="pw-strength" style="display:none">
          <div class="pw-bars">
            <div class="pw-bar" id="bar1"></div>
            <div class="pw-bar" id="bar2"></div>
            <div class="pw-bar" id="bar3"></div>
            <div class="pw-bar" id="bar4"></div>
          </div>
          <span class="pw-label" id="pw-label"></span>
        </div>
        <p class="field-error" id="su-pw-err"></p>
      </div>
      <div class="form-group">
        <label for="su-pw2">Confirm password</label>
        <input type="password" id="su-pw2" placeholder="••••••••" autocomplete="new-password">
        <p class="field-error" id="su-pw2-err"></p>
      </div>
      <button class="btn-primary" id="btn-signup" style="margin-top:4px">
        <span class="btn-text">Create account</span>
        <span class="spinner"></span>
      </button>
      <div class="or-divider">or</div>
      <button class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
        Sign up with Google
      </button>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>

</body>
</html>
