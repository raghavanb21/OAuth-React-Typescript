<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vela — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f0f0f;
    --ink2: #2a2a2a;
    --ink3: #555;
    --ink4: #999;
    --paper: #faf9f7;
    --paper2: #f2f0ec;
    --paper3: #e8e5df;
    --accent: #c8593a;
    --line: rgba(15,15,15,0.08);
    --r: 4px;
    --trans: 0.18s cubic-bezier(0.4,0,0.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  body.ready { opacity: 1; }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
    height: 64px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--ink);
    text-decoration: none;
  }
  .brand span { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    font-size: 13px;
    font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 0.03em;
    overflow: hidden;
    flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .btn-signout {
    background: none;
    border: 1px solid var(--paper3);
    border-radius: var(--r);
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink3);
    cursor: pointer;
    transition: border-color var(--trans), color var(--trans);
  }
  .btn-signout:hover { border-color: var(--ink3); color: var(--ink); }

  /* HERO */
  .hero {
    padding: 72px 48px 56px;
    max-width: 900px;
    animation: slideUp 0.5s 0.1s ease both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero-eyebrow {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink4);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hero-eyebrow::before {
    content: '';
    display: inline-block;
    width: 24px; height: 1px;
    background: var(--ink4);
  }
  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(40px, 6vw, 72px);
    line-height: 1.05;
    letter-spacing: -2px;
    color: var(--ink);
    margin-bottom: 20px;
  }
  .hero h1 .name { color: var(--accent); }
  .hero h1 em { font-style: italic; color: var(--ink3); }
  .auth-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--paper2);
    border: 1px solid var(--paper3);
    border-radius: 100px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--ink3);
  }
  .auth-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4a9e6b;
  }

  /* GRID */
  .section { padding: 0 48px 80px; animation: slideUp 0.5s 0.22s ease both; }
  .section-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink4);
    margin-bottom: 20px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1px;
    border: 1px solid var(--paper3);
    border-radius: 8px;
    overflow: hidden;
    background: var(--paper3);
  }
  .stat-card {
    background: var(--paper);
    padding: 28px 24px;
    transition: background var(--trans);
  }
  .stat-card:hover { background: var(--paper2); }
  .stat-label {
    font-size: 12px;
    color: var(--ink4);
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .stat-value {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    letter-spacing: -1px;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 6px;
  }
  .stat-sub {
    font-size: 12px;
    color: var(--ink4);
  }

  /* ACTIVITY */
  .activity-list { display: flex; flex-direction: column; gap: 0; }
  .activity-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    animation: slideUp 0.4s ease both;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--paper2);
    border: 1px solid var(--paper3);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .activity-text { flex: 1; }
  .activity-title { font-size: 14px; color: var(--ink); margin-bottom: 2px; }
  .activity-meta { font-size: 12px; color: var(--ink4); }
  .activity-time { font-size: 12px; color: var(--ink4); white-space: nowrap; }

  /* QUOTE BLOCK */
  .quote-block {
    margin: 0 48px 80px;
    padding: 32px 36px;
    border-left: 2px solid var(--ink);
    background: var(--paper2);
    border-radius: 0 8px 8px 0;
    animation: slideUp 0.5s 0.34s ease both;
  }
  .quote-block blockquote {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    line-height: 1.45;
    letter-spacing: -0.3px;
    color: var(--ink2);
    font-style: italic;
    margin-bottom: 12px;
  }
  .quote-block cite {
    font-size: 12px;
    color: var(--ink4);
    font-style: normal;
    letter-spacing: 0.04em;
  }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    nav { padding: 0 20px; }
    .hero, .section { padding-left: 20px; padding-right: 20px; }
    .quote-block { margin: 0 20px 60px; }
    .hero { padding-top: 48px; }
  }
</style>
</head>
<body>

<nav>
  <a href="#" class="brand">Vela<span>.</span></a>
  <div class="nav-right">
    <div class="avatar" id="nav-avatar"></div>
    <button class="btn-signout" onclick="signOut()">Sign out</button>
  </div>
</nav>

<header class="hero">
  <p class="hero-eyebrow" id="time-greeting">Good morning</p>
  <h1>Welcome back,<br><span class="name" id="user-name">—</span>.<br><em>Ready to focus?</em></h1>
  <br>
  <span class="auth-badge">
    <span class="dot"></span>
    <span id="auth-method-label">Signed in</span>
  </span>
</header>

<section class="section">
  <p class="section-label">Your overview</p>
  <div class="cards">
    <div class="stat-card">
      <p class="stat-label">Days active</p>
      <p class="stat-value" id="days-active">1</p>
      <p class="stat-sub">Since you joined</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Sessions</p>
      <p class="stat-value" id="session-count">1</p>
      <p class="stat-sub">Total logins</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Account type</p>
      <p class="stat-value" style="font-size:24px; letter-spacing:-0.5px; padding-top:6px" id="account-type">Free</p>
      <p class="stat-sub">No limits</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Member since</p>
      <p class="stat-value" style="font-size:22px; letter-spacing:-0.5px; padding-top:8px" id="member-since">—</p>
      <p class="stat-sub" id="member-year"></p>
    </div>
  </div>
</section>

<div class="quote-block">
  <blockquote id="daily-quote">"The secret of getting ahead is getting started."</blockquote>
  <cite id="quote-author">— MARK TWAIN</cite>
</div>

<section class="section">
  <p class="section-label">Recent activity</p>
  <div class="activity-list" id="activity-list"></div>
</section>

<script>
/* ── Guard: check session ── */
const raw = sessionStorage.getItem('vela_user');
if (!raw) {
  window.location.href = 'auth.html';
  throw new Error('No session');
}
const user = JSON.parse(raw);

/* ── Hydrate UI ── */
document.addEventListener('DOMContentLoaded', () => {
  document.body.classList.add('ready');

  // Greeting by hour
  const h = new Date().getHours();
  const greeting = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('time-greeting').textContent = greeting;

  // Name
  const first = user.name.split(' ')[0];
  document.getElementById('user-name').textContent = first;

  // Avatar
  const av = document.getElementById('nav-avatar');
  if (user.picture) {
    av.innerHTML = `<img src="${user.picture}" alt="${user.name}">`;
  } else {
    const initials = user.name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
    av.textContent = initials;
  }

  // Auth method badge
  const methodMap = { google: '✦ Signed in with Google', email: '✦ Signed in with email' };
  document.getElementById('auth-method-label').textContent = methodMap[user.method] || 'Signed in';

  // Stats from localStorage
  const users = JSON.parse(localStorage.getItem('vela_users') || '{}');
  const userData = users[user.email] || {};
  const joined = userData.joined || Date.now();
  const daysSince = Math.max(1, Math.round((Date.now() - joined) / 86400000));
  document.getElementById('days-active').textContent = daysSince;

  // Increment session count
  const scKey = 'vela_sessions_' + user.email;
  const sc = parseInt(localStorage.getItem(scKey) || '0') + 1;
  localStorage.setItem(scKey, sc);
  document.getElementById('session-count').textContent = sc;

  // Member since
  const d = new Date(joined);
  document.getElementById('member-since').textContent = d.toLocaleString('en', { month: 'short', day: 'numeric' });
  document.getElementById('member-year').textContent = d.getFullYear();

  // Activity log — log this session
  const logKey = 'vela_log_' + user.email;
  const log = JSON.parse(localStorage.getItem(logKey) || '[]');
  log.unshift({ type: 'login', method: user.method, ts: Date.now() });
  if (log.length > 12) log.length = 12;
  localStorage.setItem(logKey, JSON.stringify(log));
  renderActivity(log);
});

/* ── Activity list ── */
const icons = { login: '→', signup: '✦', google: '◈' };
function timeAgo(ts) {
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return new Date(ts).toLocaleDateString('en', { month: 'short', day: 'numeric' });
}
function renderActivity(log) {
  const el = document.getElementById('activity-list');
  if (!log.length) { el.innerHTML = '<p style="color:var(--ink4);font-size:14px;padding:16px 0">No activity yet.</p>'; return; }
  el.innerHTML = log.map((item, i) => `
    <div class="activity-item" style="animation-delay:${i*0.05}s">
      <div class="activity-icon">${icons[item.type] || '·'}</div>
      <div class="activity-text">
        <p class="activity-title">${item.type === 'login' ? 'Signed in' : 'Account created'}</p>
        <p class="activity-meta">via ${item.method === 'google' ? 'Google OAuth' : 'email & password'}</p>
      </div>
      <span class="activity-time">${timeAgo(item.ts)}</span>
    </div>
  `).join('');
}

/* ── Quotes ── */
const quotes = [
  { q: 'The secret of getting ahead is getting started.', a: 'MARK TWAIN' },
  { q: 'Simplicity is the ultimate sophistication.', a: 'LEONARDO DA VINCI' },
  { q: 'Do one thing every day that scares you.', a: 'ELEANOR ROOSEVELT' },
  { q: 'Make each day your masterpiece.', a: 'JOHN WOODEN' },
  { q: 'Everything you can imagine is real.', a: 'PABLO PICASSO' },
  { q: 'Clarity about what matters provides clarity about what does not.', a: 'CAL NEWPORT' },
];
const q = quotes[new Date().getDate() % quotes.length];
document.getElementById('daily-quote').textContent = `"${q.q}"`;
document.getElementById('quote-author').textContent = `— ${q.a}`;

/* ── Sign out ── */
function signOut() {
  sessionStorage.removeItem('vela_token');
  sessionStorage.removeItem('vela_user');
  window.location.href = 'auth.html';
}
</script>
</body>
</html>
