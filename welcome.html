<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credly — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/welcome.css">
<script type="module" src="js/welcome/index.js"></script>
</head>
<body>

<nav>
  <a href="#" class="brand">Credly<span>.</span></a>
  <div class="nav-right">
    <div class="avatar" id="nav-avatar"></div>
    <button class="btn-signout" id="btn-signout">Sign out</button>
  </div>
</nav>

<header class="hero">
  <p class="hero-eyebrow" id="time-greeting">Good morning</p>
  <h1>Welcome back,<br><span class="name" id="user-name">—</span>.<br><em>Ready to focus?</em></h1>
  <br>
  <span class="auth-badge">
    <span class="dot"></span>
    <span id="auth-method-label">Signed in</span>
  </span>
</header>

<section class="section">
  <p class="section-label">Your overview</p>
  <div class="cards">
    <div class="stat-card">
      <p class="stat-label">Days active</p>
      <p class="stat-value" id="days-active">1</p>
      <p class="stat-sub">Since you joined</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Sessions</p>
      <p class="stat-value" id="session-count">1</p>
      <p class="stat-sub">Total logins</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Account type</p>
      <p class="stat-value" style="font-size:24px; letter-spacing:-0.5px; padding-top:6px" id="account-type">Free</p>
      <p class="stat-sub">No limits</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Member since</p>
      <p class="stat-value" style="font-size:22px; letter-spacing:-0.5px; padding-top:8px" id="member-since">—</p>
      <p class="stat-sub" id="member-year"></p>
    </div>
  </div>
</section>

<div class="quote-block">
  <blockquote id="daily-quote">"The secret of getting ahead is getting started."</blockquote>
  <cite id="quote-author">— MARK TWAIN</cite>
</div>

<section class="section">
  <p class="section-label">Recent activity</p>
  <div class="activity-list" id="activity-list"></div>
</section>

</body>
</html>
